<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page">
  <header class="header">
    <div class="header__logo">💸 Expense Tracker</div>
    <span class="header__greeting" id="greeting"></span>
    <button class="header__btn" id="auth-btn" type="button">Войти через Google</button>
  </header>

  <main class="page__content">
    <section class="summary">
      <article class="summary-card summary-card--balance">
        <h2 class="summary-card__title">Баланс</h2>
        <p class="summary-card__value" id="balance">0.00</p>
      </article>
      <article class="summary-card summary-card--income">
        <h2 class="summary-card__title">Доходы</h2>
        <p class="summary-card__value" id="income">0.00</p>
      </article>
      <article class="summary-card summary-card--expense">
        <h2 class="summary-card__title">Расходы</h2>
        <p class="summary-card__value" id="expense">0.00</p>
      </article>
    </section>

    <form class="form" id="tx-form" hidden>
      <input class="form__field" name="title" placeholder="Название" required>
      <input class="form__field" name="amount" type="number" min="0.01" step="0.01" placeholder="Сумма" required>
      <select class="form__field" name="type">
        <option value="expense">Расход</option>
        <option value="income">Доход</option>
      </select>
      <select class="form__field" name="category">
        <option value="food">Продукты</option>
        <option value="transport">Транспорт</option>
        <option value="entertainment">Развлечения</option>
        <option value="bills">Коммуналка</option>
      </select>
      <button class="form__btn" type="submit">Добавить</button>
    </form>

    <section class="transactions">
      <div class="transactions__head">
        <span>Название</span><span>Категория</span><span>Дата</span><span>Сумма</span>
      </div>
      <ul class="transactions__list" id="tx-list"></ul>
      <p class="transactions__empty" id="tx-empty">Войдите, чтобы увидеть транзакции</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js"></script>
</body>
</html>
